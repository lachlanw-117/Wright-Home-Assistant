# Tuya exposes no oscillation state. This tracks the last requested scene only.
- switch:
    - name: Black Fan Swing
      unique_id: black_fan_swing
      availability: >
        {{ states('fan.living_room_black_fan') in ['on', 'off']
           and as_timestamp(states('scene.fan_swing_on'), 0) > 0
           and as_timestamp(states('scene.fan_swing_off'), 0) > 0 }}
      state: >
        {{ is_state('fan.living_room_black_fan', 'on')
           and as_timestamp(states('scene.fan_swing_on'), 0)
             > as_timestamp(states('scene.fan_swing_off'), 0) }}
      turn_on:
        - action: scene.turn_on
          target:
            entity_id: scene.fan_swing_on
      turn_off:
        - action: scene.turn_on
          target:
            entity_id: scene.fan_swing_off
