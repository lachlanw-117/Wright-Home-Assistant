      - entity: input_boolean.attention_fridge_unavailable_lachlan_home
        name: Lachlan phone when home
      - entity: input_boolean.attention_fridge_unavailable_lachlan_away
        name: Lachlan phone when away
      - entity: input_boolean.attention_fridge_unavailable_nic_home
        name: Nic phone when home
      - entity: input_boolean.attention_fridge_unavailable_nic_away
        name: Nic phone when away
      - entity: input_datetime.attention_fridge_unavailable_pause_until
        name: Pause all routes until
