# Generated by tools/build_attention_controls.py; runtime values are not set here.
views:
- title: Dashboard
  path: dashboard
  cards:
  - type: markdown
    title: Household attention
    content: |-
      {% set items = state_attr('sensor.household_attention_dashboard', 'items') or [] %}
      {% for kind, label in [('fault', 'Faults'), ('attention', 'Maintenance'), ('event', 'Events')] %}
      ## {{ label }}
      {% for category, category_items in items | selectattr('kind', 'eq', kind) | groupby('category') %}
      ### {{ category | title }}
      {% for item in category_items %}
      - **{{ item.get('display_name', item.title) }}** — {{ item.title }} ({{ item.kind }}, {{ item.quality }})
      {% endfor %}
      {% else %}None.{% endfor %}
      {% endfor %}
      All active items remain in Inbox. Coverage: {{ state_attr('sensor.household_attention_inbox', 'coverage') }}
- title: Inbox
  path: inbox
  cards:
  - type: markdown
    title: Private household inbox
    content: |
      {% set items = state_attr('sensor.household_attention_inbox', 'items') or [] %}
      Health: {{ state_attr('sensor.household_attention_inbox', 'health') }}
      Coverage: {{ state_attr('sensor.household_attention_inbox', 'coverage') }}
      Confirmed faults: {{ state_attr('sensor.household_attention_inbox', 'fault_count') }}
      {% for kind, label in [('fault', 'Faults'), ('attention', 'Maintenance'), ('event', 'Events')] %}
      ## {{ label }}
      {% for category, category_items in items | selectattr('kind', 'eq', kind) | groupby('category') %}
      ### {{ category | title }}
      {% for item in category_items %}
      #### {{ item.get('display_name', item.title) }}
      {{ item.title }}
      {{ item.kind }} · {{ item.severity }} · observation {{ item.quality }}
      {% for evidence in item.evidence %}
      - {{ evidence.entity_id }}: {{ evidence.state }}
      {% endfor %}
      {% for detail in item.details %}
      - {{ detail.component }}: {{ detail.installed_version }} → {{ detail.latest_version }}
      {% endfor %}
      {% endfor %}
      {% else %}None.{% endfor %}
      {% endfor %}
      Coverage gaps: {{ state_attr('sensor.household_attention_inbox', 'uncertain_sources') }}

      {% for item in state_attr('sensor.household_attention_inbox', 'recent_events') or [] %}
      Recent event: **{{ item.get('display_name', item.title) }}** - {{ item.title }} - delivery {{ item.delivery_state }}.
      {% endfor %}
- title: Delivery controls
  path: controls
  cards:
  - type: markdown
    title: Delivery preferences
    content: |-
      Each row has dashboard, TV and home/away phone switches for each person. Both phone switches on means always, including when presence is unknown; both off means no phone alert. Selecting only home or away requires a matching report no older than 15 minutes. The inbox always keeps active items. All switches start off on first install and restore thereafter. A row pause expires automatically and preserves switches. Existing phone choices are preserved during the reviewed home/away migration. Washing is a one-shot notice; its red laundry lighting stays independent.

      Home/away controls: {{ 'ready' if is_state('input_boolean.attention_presence_routes_migrated', 'on') else 'setup pending; current phone delivery stays active' }}.
  - type: entities
    show_header_toggle: false
    entities:
    - script.household_attention_apply_starting_preferences
    - input_boolean.attention_preferences_configured
    - input_boolean.attention_routing_enabled
  - type: markdown
    title: Phone presence
    content: |-
      {% for person, label in [('lachlan', 'Lachlan'), ('nic', 'Nic')] %}
      {% set entity = 'sensor.household_attention_' ~ person ~ '_presence' %}
      {% set evidence = state_attr(entity, 'evidence') or {} %}
      **{{ label }}:** {{ states(entity) }} — {{ evidence.get('reason', 'Waiting for reports') }}.
      Location report age: {{ evidence.get('gps_age_seconds') if evidence.get('gps_age_seconds') is number else 'unknown' }} seconds; Wi-Fi report age: {{ evidence.get('wifi_age_seconds') if evidence.get('wifi_age_seconds') is number else 'unknown' }} seconds.
      {% endfor %}
  - type: markdown
    content: '## Appliances'
  - type: vertical-stack
    cards:
    - type: markdown
      title: Fridge
      content: HA cannot reach the fridge through one or more channels
    - type: entities
