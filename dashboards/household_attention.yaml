# Generated by tools/build_attention_controls.py; runtime values are not set here.
views:
- title: Dashboard
  path: dashboard
  cards:
  - type: markdown
    title: Household attention
    content: |-
      {% for item in state_attr('sensor.household_attention_dashboard', 'items') or [] %}
      - **{{ item.title }}** ({{ item.quality }})
      {% else %}No routed dashboard items. All active items remain in Inbox.{% endfor %}
- title: Inbox
  path: inbox
  cards:
  - type: markdown
    title: Private household inbox
    content: |
      {% set items = state_attr('sensor.household_attention_inbox', 'items') or [] %}
      Health: {{ state_attr('sensor.household_attention_inbox', 'health') }}
      Coverage: {{ state_attr('sensor.household_attention_inbox', 'coverage') }}
      Confirmed faults: {{ state_attr('sensor.household_attention_inbox', 'fault_count') }}
      {% for item in items %}
      ### {{ item.title }}
      {{ item.kind }} · {{ item.severity }} · observation {{ item.quality }}
      {% for evidence in item.evidence %}
      - {{ evidence.entity_id }}: {{ evidence.state }}
      {% endfor %}
      {% for detail in item.details %}
      - {{ detail.component }}: {{ detail.installed_version }} → {{ detail.latest_version }}
      {% endfor %}
      {% else %}No active items. Check coverage below.{% endfor %}
      Coverage gaps: {{ state_attr('sensor.household_attention_inbox', 'uncertain_sources') }}

      {% for item in state_attr('sensor.household_attention_inbox', 'recent_events') or [] %}
      Recent event: **{{ item.title }}** - delivery {{ item.delivery_state }}.
      {% endfor %}
- title: Delivery controls
  path: controls
  cards:
  - type: markdown
    title: Delivery preferences
    content: Each row has dashboard, TV and one phone switch per person. Phone delivery
      does not depend on location. The inbox always keeps active items. All switches
      start off on first install and restore thereafter. A row pause expires automatically
      and preserves switches. Apply starting preferences once during the reviewed
      setup, then enable shared phone routing. Washing is a one-shot notice; its red
      laundry lighting stays independent.
  - type: entities
    show_header_toggle: false
    entities:
    - script.household_attention_apply_starting_preferences
    - input_boolean.attention_preferences_configured
    - input_boolean.attention_routing_enabled
  - type: entities
    title: HA cannot reach the fridge through one or more channels
    show_header_toggle: false
    entities:
    - entity: input_boolean.attention_fridge_unavailable_dashboard
      name: HA dashboard
    - entity: input_boolean.attention_fridge_unavailable_tv
      name: TV screensaver
    - entity: input_boolean.attention_fridge_unavailable_lachlan_phone
      name: Lachlan phone
    - entity: input_boolean.attention_fridge_unavailable_nic_phone
      name: Nic phone
    - entity: input_datetime.attention_fridge_unavailable_pause_until
      name: Pause all routes until
  - type: entities
    title: HA cannot reach the Dyson Purifier Hot+Cool De-NOx
    show_header_toggle: false
