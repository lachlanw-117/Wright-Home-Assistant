name: Local checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    name: YAML and automation reliability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HA_AUTOMATION_BASE_REF: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Parse tracked YAML without resolving HA includes or secrets
        run: python tests/validate_yaml.py
      - name: Exercise automation policies with synthetic states
        run: python -m unittest discover -s tests -v
