  description: ''
  triggers:
  - device_id: 147f7064dad611670e7a0cff50d04ace
    domain: zha
    type: remote_button_long_press
    subtype: dim_up
    trigger: device
    id: dim_up
  - device_id: 147f7064dad611670e7a0cff50d04ace
    domain: zha
    type: remote_button_long_press
    subtype: dim_down
    trigger: device
    id: dim_down
  - device_id: 147f7064dad611670e7a0cff50d04ace
    domain: zha
    type: remote_button_long_release
    subtype: dim_up
    trigger: device
    id: dim_stop
  - device_id: 147f7064dad611670e7a0cff50d04ace
    domain: zha
    type: remote_button_long_release
    subtype: dim_down
    trigger: device
    id: dim_stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dim_up
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ true }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.kitchen_lights
            data:
              brightness_step_pct: 4
              transition: 0.2
          - delay:
              milliseconds: 500
    - conditions:
      - condition: trigger
        id: dim_down
