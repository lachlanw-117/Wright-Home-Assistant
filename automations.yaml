- id: '1781747009381'
  alias: Kitchen Button 2.1-4.1 - Lights Brighter/Dimmer - Slide
  description: ''
  triggers:
  - device_id: 147f7064dad611670e7a0cff50d04ace
    domain: zha
    type: remote_button_long_press
    subtype: dim_up
    trigger: device
    id: dim_up
  - device_id: 147f7064dad611670e7a0cff50d04ace
    domain: zha
    type: remote_button_long_press
    subtype: dim_down
    trigger: device
    id: dim_down
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dim_up
      sequence:
      - repeat:
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.kitchen_lights
            data:
              brightness_step_pct: 4
              transition: 0.2
          - wait_for_trigger:
            - device_id: 147f7064dad611670e7a0cff50d04ace
              domain: zha
              type: remote_button_long_release
              subtype: dim_up
              trigger: device
            timeout:
              milliseconds: 500
            continue_on_timeout: true
          until:
          - condition: template
            value_template: '{{ wait.completed }}'
    - conditions:
      - condition: trigger
        id: dim_down
      sequence:
      - condition: state
        entity_id: light.kitchen_lights
        state: 'on'
      - repeat:
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.kitchen_lights
            data:
              brightness_step_pct: -4
              transition: 0.2
          - wait_for_trigger:
            - device_id: 147f7064dad611670e7a0cff50d04ace
              domain: zha
              type: remote_button_long_release
              subtype: dim_down
              trigger: device
            timeout:
              milliseconds: 500
            continue_on_timeout: true
          until:
          - condition: template
            value_template: '{{ wait.completed }}'
  mode: restart
- id: '1786045283876'
  alias: Laundry switch controls LED strip
  description: 'IKEA RODRET controls the laundry Hue strip. Short presses turn it
    on in cool white or off. Long presses smoothly adjust brightness.

    '
  triggers:
  - trigger: device
    device_id: fdd3cacb7aad644ba3cbbe0ef569bbfd
    domain: zha
    type: remote_button_short_press
    subtype: turn_on
    id: turn_on
  - trigger: device
    device_id: fdd3cacb7aad644ba3cbbe0ef569bbfd
    domain: zha
    type: remote_button_short_press
    subtype: turn_off
    id: turn_off
  - trigger: device
    device_id: fdd3cacb7aad644ba3cbbe0ef569bbfd
    domain: zha
    type: remote_button_long_press
    subtype: dim_down
    id: dim_down
  - trigger: device
    device_id: fdd3cacb7aad644ba3cbbe0ef569bbfd
    domain: zha
    type: remote_button_long_press
    subtype: dim_up
    id: dim_up
  - trigger: device
    device_id: fdd3cacb7aad644ba3cbbe0ef569bbfd
    domain: zha
    type: remote_button_long_release
    subtype: dim_down
    id: dim_down_release
  - trigger: device
    device_id: fdd3cacb7aad644ba3cbbe0ef569bbfd
    domain: zha
    type: remote_button_long_release
    subtype: dim_up
    id: dim_up_release
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: turn_on
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.laundry_led_strip
        data:
          color_temp_kelvin: 4000
          transition: 0.3
    - conditions:
      - condition: trigger
        id: turn_off
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.laundry_led_strip
        data:
          transition: 0.3
    - conditions:
      - condition: trigger
        id: dim_up
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.laundry_led_strip
        data:
          color_temp_kelvin: 4000
          transition: 0.2
      - repeat:
          while:
          - condition: template
            value_template: '{{ true }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.laundry_led_strip
            data:
              brightness_step_pct: 3
              transition: 0.12
          - delay:
              milliseconds: 120
    - conditions:
      - condition: trigger
        id: dim_down
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.laundry_led_strip
        data:
          color_temp_kelvin: 4000
          transition: 0.2
      - repeat:
          while:
          - condition: template
            value_template: '{{ true }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.laundry_led_strip
            data:
              brightness_step_pct: -3
              transition: 0.12
          - delay:
              milliseconds: 120
  mode: restart
