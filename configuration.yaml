
# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages:
    household_attention: !include packages/household_attention.yaml

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include templates.yaml

#for the stupid tuya blinds
zha:
  custom_quirks_path: /config/custom_zha_quirks


# for version controlled dashboard
lovelace:
  mode: storage
  dashboards:
    household-attention:
      mode: yaml
      title: Household Attention
      icon: mdi:inbox
      show_in_sidebar: true
      filename: dashboards/household_attention.yaml
    our-home-v2:
      mode: yaml
      title: Our Home V2
      icon: mdi:home
      show_in_sidebar: true
      filename: dashboards/our_home_v2.yaml
