party_kids_room:
  alias: Party - Kids Room
  description: Cycle the two full-colour Matter bulbs through offset colours
  mode: restart
  sequence:
    - variables:
        party_colours:
          - [0, 100]
          - [45, 100]
          - [120, 100]
          - [180, 100]
          - [240, 100]
          - [300, 100]

    - repeat:
        while:
          - condition: template
            value_template: "{{ true }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.kids_room_kids_bedroom_light_1
            data:
              hs_color: >
                {{ party_colours[(repeat.index - 1) % (party_colours | count)] }}
              brightness_pct: 100
              transition: 0.7

          - action: light.turn_on
            target:
              entity_id: light.kids_room_kids_bedroom_light_2
            data:
              hs_color: >
                {{ party_colours[(repeat.index + 2) % (party_colours | count)] }}
              brightness_pct: 100
              transition: 0.7

          - delay:
              milliseconds: 850


party_living_room:
  alias: Party - Living Room
  description: Pulse white-only lights through brightness and colour temperature
  mode: restart
  sequence:
    - repeat:
        while:
          - condition: template
            value_template: "{{ true }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.living_room_living_room_lights
            data:
              brightness_pct: "{{ 100 if repeat.index % 2 else 25 }}"
              color_temp_kelvin: "{{ 4000 if repeat.index % 2 else 2700 }}"
              transition: 0.8

          - delay:
              seconds: 1


party_bedroom:
  alias: Party - Bedroom
