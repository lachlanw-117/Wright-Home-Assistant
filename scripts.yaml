# Whole-house and room-level party mode controllers.
# Room scripts stay separate so individual room controls can be exposed later.
all_lights_off:
  alias: All Lights Off
  description: Stop party mode before switching off the master light group
  mode: restart
  sequence:
    - action: script.turn_off
      target:
        entity_id:
          - script.party_bathroom
          - script.party_ensuite
          - script.party_kitchen
          - script.party_laundry
          - script.party_kids_room
          - script.party_living_room
          - script.party_bedroom

    - action: light.turn_off
      target:
        entity_id: light.light_master_switch


party_mode_toggle:
  alias: Toggle Whole-House Party Mode
  description: Start all room party effects, or stop them and turn all lights off
  mode: restart
  sequence:
    - if:
        - condition: template
          value_template: >
            {{ is_state('script.party_bathroom', 'on')
               or is_state('script.party_ensuite', 'on')
               or is_state('script.party_kitchen', 'on')
               or is_state('script.party_laundry', 'on')
               or is_state('script.party_kids_room', 'on')
               or is_state('script.party_living_room', 'on')
               or is_state('script.party_bedroom', 'on') }}
      then:
        - action: script.all_lights_off
      else:
        - action: script.turn_on
          target:
            entity_id:
              - script.party_bathroom
              - script.party_ensuite
              - script.party_kitchen
              - script.party_laundry
              - script.party_kids_room
              - script.party_living_room
              - script.party_bedroom


party_bathroom:
  alias: Party - Bathroom
  description: Use the Tapo lights' native Party effect
  mode: restart
  sequence:
    - action: light.turn_on
      target:
        entity_id: light.bathroom_lights
      data:
        effect: Party
        brightness_pct: 100

    - repeat:
        while:
          - condition: template
            value_template: "{{ true }}"
        sequence:
          - delay:
              hours: 1


